# Fly.io app for the conference archives reader. Not deployed yet: see DEPLOY.md.
app = "wacc-conference-reader"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  READER_CONTACT = "jlewis2@olympic.edu"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
